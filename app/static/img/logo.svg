<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <defs>
    <!-- Background Gradient: Cyan at top-right to Deep Violet at bottom-left -->
    <linearGradient id="bgGradient" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00C8FF"/>
      <stop offset="25%" stop-color="#06B6D4"/>
      <stop offset="55%" stop-color="#2563EB"/>
      <stop offset="85%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>

    <!-- 3D Book Spine Left Face Gradient -->
    <linearGradient id="spineGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#0EA5E9"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>

    <!-- Top Fold Highlight -->
    <linearGradient id="bevelHighlight" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#E0F2FE"/>
    </linearGradient>

    <!-- Bottom Inward Fold Shadow -->
    <linearGradient id="shadowFold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1B4B"/>
      <stop offset="50%" stop-color="#312E81"/>
      <stop offset="100%" stop-color="#4338CA"/>
    </linearGradient>

    <!-- Horizontal Text Bar Blue Gradient -->
    <linearGradient id="barGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>

    <!-- Subtle Drop Shadow for B -->
    <filter id="iconShadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#0F172A" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Outer Rounded Square App Icon Background -->
  <rect x="24" y="24" width="464" height="464" rx="116" fill="url(#bgGradient)"/>

  <!-- Logo Mark (Letter B + Folded Document) with depth shadow -->
  <g filter="url(#iconShadow)">
    
    <!-- 3D Book Spine (Left Folded Face) -->
    <path d="M 124 190 
             L 182 122 
             L 182 342 
             L 132 418 
             Q 124 416 124 402 
             Z" 
          fill="url(#spineGradient)"/>

    <!-- Top Bevel Edge Highlight of Spine -->
    <polygon points="124,190 182,122 170,118 120,175" fill="url(#bevelHighlight)" opacity="0.9"/>

    <!-- Bottom Fold / Crease Shadow -->
    <polygon points="132,418 182,342 280,366 182,414" fill="url(#shadowFold)"/>

    <!-- Main Solid White Body of "B" -->
    <!-- Outer contour of the letter B -->
    <path d="M 182 118
             L 325 118
             C 375 118, 402 144, 402 186
             C 402 222, 384 242, 355 252
             C 392 262, 418 290, 418 338
             C 418 392, 375 422, 316 422
             L 182 422
             L 182 342
             L 182 118 Z"
          fill="#FFFFFF"/>

    <!-- Hollow of Lower Loop of B -->
    <path d="M 238 295
             L 308 295
             C 342 295, 362 312, 362 342
             C 362 372, 342 388, 308 388
             L 238 388
             Z"
          fill="url(#bgGradient)" opacity="0.98"/>

    <!-- Three Rounded Horizontal Text Lines inside Upper Section of B -->
    <!-- Line 1 -->
    <rect x="206" y="162" width="134" height="20" rx="10" fill="url(#barGradient)"/>
    <!-- Line 2 -->
    <rect x="206" y="202" width="128" height="20" rx="10" fill="url(#barGradient)"/>
    <!-- Line 3 -->
    <rect x="206" y="242" width="102" height="20" rx="10" fill="url(#barGradient)"/>

  </g>
</svg>

