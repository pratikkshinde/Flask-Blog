{% extends "base.html" %}

{% block content %}
<div class="container py-5 text-center">
    <div class="empty-state py-5 my-0">
        <div class="display-1 fw-bold text-warning mb-3">500</div>
        <h2 class="fw-bold text-dark mb-2">Internal Server Error</h2>
        <p class="text-secondary mx-auto mb-4" style="max-width: 500px;">
            Something unexpected occurred on our end while processing your request. Please try refreshing or return to the homepage.
        </p>
        <div class="d-flex justify-content-center gap-2">
            <a href="{{ url_for('main.index') }}" class="btn btn-primary px-4 rounded-pill">
                <i class="bi bi-house-door me-1"></i> Return Home
            </a>
            <a href="javascript:history.back()" class="btn btn-outline-secondary px-4 rounded-pill">
                <i class="bi bi-arrow-left me-1"></i> Go Back
            </a>
        </div>
    </div>
</div>
{% endblock %}
